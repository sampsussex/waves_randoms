[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waves_randoms"
version = "0.1.0"
description = "Utilities and reference data for generateing waves randoms, and masking"
authors = [{name = "Sam Philipsborn"}]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
"numpy",
"pandas",
"scipy", 
"regionx",
"pyarrow"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project = ["masks/*.dat"]
